name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write para el commit del sync que adopta fichas web a catalogo/ (03);
  # el resto del pipeline solo lee
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # full: el sync empuja el commit de adopción desde este clon
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # adopción ANTES de hornear: la ficha web pasa de servirse por la
      # fusión del edge a servirse por el índice horneado, sin salto — un
      # deploy nunca se come una ficha en camino (invariante del prototipo)
      - name: adoptar fichas web al catálogo (sync)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/adoptar-fichas-web.mjs

      - name: deps del workspace (vite/three para el cliente público)
        run: npm ci --ignore-scripts

      - name: deps de eval
        working-directory: eval
        run: npm ci --ignore-scripts

      - name: suite contra Workers AI (suelo 0.754)
        working-directory: eval
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node harness-workers.mjs

      - name: construir desplegable público
        working-directory: eval
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node build-public.mjs

      - name: replay del re-ranking (el feedback marcado no puede bajar el recall)
        working-directory: eval
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node replay-rerank.mjs

      - name: desplegar a Cloudflare Pages (sitio + Worker de buscar)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'it-sounds-like' }}
        run: npx --yes wrangler pages deploy --project-name="${PAGES_PROJECT}" --branch=main

      - name: desplegar el cron de purge (worker con binding D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler deploy --config cron/wrangler.toml
