# Configuración de Cloudflare Pages del sitio público: mismo proyecto que
# despliega el CI (dist-public), con el binding de Workers AI que usa
# /api/buscar para embedear la query con bge-m3 en el edge.
name = "it-sounds-like"
pages_build_output_dir = "dist-public"
compatibility_date = "2026-08-24"

[ai]
binding = "AI"

# feedback público: la tupla del ticket 03 (base D1 it-sounds-like-feedback).
# (requiere D1 Edit en el token; ver scripts/wizard-d1.md)
[[d1_databases]]
binding = "DB"
database_name = "it-sounds-like-feedback"
database_id = "9ed264fa-d191-4ac5-862e-b892908cba3f"
