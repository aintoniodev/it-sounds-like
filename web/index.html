<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>it sounds like</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0c0c0e; color: #d8d8d2;
      font-family: "Departure Mono", ui-monospace, monospace; font-size: 15px;
      display: flex; flex-direction: column; align-items: center; padding: 4vh 5vw;
    }
    h1 { font-size: 15px; font-weight: normal; letter-spacing: 0.3em; text-transform: uppercase; color: #8a8a80; }
    form { display: flex; gap: 8px; width: min(640px, 100%); }
    input {
      flex: 1; background: #141416; border: 1px solid #2a2a2e; color: #d8d8d2;
      font: inherit; padding: 10px 12px; border-radius: 2px;
    }
    input:focus { outline: none; border-color: #5a5a60; }
    button {
      background: #1e1e22; border: 1px solid #2a2a2e; color: #d8d8d2;
      font: inherit; padding: 10px 16px; border-radius: 2px; cursor: pointer;
    }
    button:hover { background: #26262c; }
    #estado { margin: 8px 0; color: #8a8a80; min-height: 1.2em; }
    main { width: min(640px, 100%); }
    .ficha { border: 1px solid #222226; border-radius: 2px; padding: 14px 16px; margin-bottom: 12px; }
    .ficha header { display: flex; justify-content: space-between; gap: 12px; color: #8a8a80; margin-bottom: 8px; }
    .ficha .titulo { color: #e8e8e0; }
    .ficha .score { color: #5a5a60; white-space: nowrap; }
    .ficha pre { white-space: pre-wrap; margin: 0; font: inherit; line-height: 1.55; color: #b8b8b0; }
    a { color: #9ab8a0; }
  </style>
</head>
<body>
  <h1>it sounds like</h1>
  <form id="buscar">
    <input id="q" placeholder="¿cómo quieres que te suene?" autocomplete="off" autofocus />
    <button>buscar</button>
  </form>
  <div id="estado"></div>
  <main id="resultados"></main>
  <script type="module">
    const $ = (s) => document.querySelector(s);

    $("#buscar").addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = $("#q").value.trim();
      if (!q) return;
      $("#estado").textContent = "buscando…";
      const r = await fetch("/api/buscar", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ q }),
      });
      const { resultados } = await r.json();
      $("#estado").textContent = `${resultados.length} canciones para "${q}"`;
      $("#resultados").replaceChildren(
        ...resultados.map((f) => {
          const art = document.createElement("article");
          art.className = "ficha";
          const head = document.createElement("header");
          const titulo = document.createElement("span");
          titulo.className = "titulo";
          titulo.textContent = `${f.titulo} — ${f.artista}`;
          const score = document.createElement("span");
          score.className = "score";
          score.textContent = f.score.toFixed(3);
          head.append(titulo, score);
          const cuerpo = document.createElement("pre");
          cuerpo.textContent = f.body;
          if (f.spotify) {
            const link = document.createElement("a");
            link.href = f.spotify;
            link.target = "_blank";
            link.textContent = f.spotify;
            art.append(head, cuerpo, link);
          } else {
            art.append(head, cuerpo);
          }
          return art;
        }),
      );
    });
  </script>
</body>
</html>
